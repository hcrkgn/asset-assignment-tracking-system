<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AATS | Home</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="container">

    <div class="card">

        <h1>Welcome, {{ session["user_name"] }}!</h1>
        <p>Login successful.</p>

        <div class="actions">
            <a href="{{ url_for('assets') }}" class="btn">
                Assets
            </a>

            <a href="{{ url_for('assignments') }}" class="btn btn-edit">
                Assignments
            </a>

            <a href="{{ url_for('requests_page') }}" class="btn btn-primary">
                My Requests
            </a>

            <a href="{{ url_for('notifications') }}" class="btn">
                Notifications
            </a>

            {% if session.get("role_id") == 3 %}
              <a href="{{ url_for('manager_requests') }}" class="btn">
                   Manage Requests
              </a>
            {% endif %}

            {% if session.get("role_id") in [1, 3] %}
                <a href="{{ url_for('audit_logs') }}" class="btn">
                   Audit Logs
                </a>
            {% endif %}

        </div>

        <hr>

        <h2>Session</h2>

        <button id="session-check-button" type="button">
            Check Session
        </button>

        <p id="session-result"></p>

        <form method="POST" action="{{ url_for('logout') }}">
            <button type="submit" class="btn-danger">
                Log out
            </button>
        </form>

    </div>

</div>

<script>
    const button = document.getElementById("session-check-button");
    const result = document.getElementById("session-result");

    button.addEventListener("click", async () => {
        const response = await fetch("/api/session", {
            headers: {
                "X-Requested-With": "XMLHttpRequest"
            }
        });

        if (response.status === 401) {
            const data = await response.json();

            alert(data.message);
            window.location.href = "/login";
            return;
        }

        const data = await response.json();
        result.textContent = `Active Session: ${data.user_name}`;
    });
</script>

</body>
</html>
