<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AATS | Import Assets</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="container">
    <div class="card">

        <h1>Import Assets</h1>
        <p>Select a CSV file to import assets.</p>

        <form method="POST" enctype="multipart/form-data">

            <div class="form-group">
                <label for="file">CSV File</label>
                <input
                    type="file"
                    id="file"
                    name="file"
                    accept=".csv"
                    required
                >
            </div>

            <div class="form-actions">
                <button type="submit">
                    Import CSV
                </button>

                <a href="{{ url_for('assets') }}" class="btn btn-secondary">
                    Cancel
                </a>
            </div>

        </form>

    </div>
</div>

</body>
</html>
