<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AATS | Assign Asset</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

{% with messages = get_flashed_messages() %}
    {% if messages %}
        <div class="flash-container">
            {% for message in messages %}
                <div class="flash-message">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
    {% endif %}
{% endwith %}

<div class="container">

    <div class="card">

        <h1>Assign Asset</h1>
        <p>Enter assignment information.</p>

        <form method="POST">

            <div class="form-group">
                <label for="AssetID">Asset</label>

                <select id="AssetID" name="AssetID" required>
                    {% for asset in assets %}
                        <option value="{{ asset.AssetID }}">
                            {{ asset.Code }} - {{ asset.AssetName }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="UserID">Employee</label>

                <select id="UserID" name="UserID" required>
                    {% for user in users %}
                        <option value="{{ user.UserID }}">
                            {{ user.Name }} - {{ user.Email }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="AssignedDate">Assigned Date</label>

                <input
                    type="date"
                    id="AssignedDate"
                    name="AssignedDate"
                    required
                >
            </div>
        

            <div class="form-group">
                <label for="Quantity">Quantity</label>

                <input
                    type="number"
                    id="Quantity"
                    name="Quantity"
                    value="1"
                    min="1"
                    required
                >
            </div>

            <div class="form-group">
                <label for="Note">Note</label>

                <textarea
                    id="Note"
                    name="Note"
                    rows="4"
                    placeholder="Optional note"
                ></textarea>
            </div>

            <div class="form-actions">

                <button type="submit">
                    Assign Asset
                </button>

                <a
                    href="{{ url_for('assignments') }}"
                    class="btn btn-secondary"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
