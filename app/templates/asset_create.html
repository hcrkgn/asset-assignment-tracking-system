<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AATS | Add Asset</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div class="flash-container">
                {% for message in messages %}
                    <div class="flash-message">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}

    <div class="container">
        
    <div class="card">

        <h1>Add Asset</h1>
        <p>Enter asset information.</p>

        <form method="POST" enctype="multipart/form-data">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">


            <div class="form-group">
                <label for="Code">Code</label>
                <input type="text" id="Code" name="Code" required>
            </div>

            <div class="form-group">
                <label for="AssetName">Asset Name</label>
                <input type="text" id="AssetName" name="AssetName" required>
            </div>

            <div class="form-group">
                <label for="CategoryID">Category</label>
                <select id="CategoryID" name="CategoryID" required>
                    {% for category in categories %}
                        <option value="{{ category.CategoryID }}">
                            {{ category.CategoryName }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="LocationID">Location</label>
                <select id="LocationID" name="LocationID" required>
                    {% for location in locations %}
                        <option value="{{ location.LocationID }}">
                            {{ location.LocationName }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="Brand">Brand</label>
                <input type="text" id="Brand" name="Brand">
            </div>

            <div class="form-group">
                <label for="Model">Model</label>
                <input type="text" id="Model" name="Model">
            </div>

            <div class="form-group">
                <label for="SerialNumber">Serial Number</label>
                <input type="text" id="SerialNumber" name="SerialNumber">
            </div>

            <div class="form-group">
                <label for="Quantity">Quantity</label>
                <input type="number" id="Quantity" name="Quantity" value="1" min="1">
            </div>

            <div class="form-group">
                <label for="AssetType">Asset Type</label>
                <select id="AssetType" name="AssetType" required>
                    <option value="">Select Asset Type</option>
                    <option value="Individual">Individual</option>
                    <option value="Consumable">Consumable</option>
                </select>
            </div>

            <div class="form-group">
                <label for="PurchaseDate">Purchase Date</label>
                <input type="date" id="PurchaseDate" name="PurchaseDate">
            </div>

            <div class="form-group">
                <label for="PurchasePrice">Purchase Price</label>
                <input
                    type="number"
                    id="PurchasePrice"
                    name="PurchasePrice"
                    step="0.01"
                    min="0"
                >
                
            </div>

            <div class="form-group">
                <label for="WarrantyEnd">Warranty End</label>
                <input type="date" id="WarrantyEnd" name="WarrantyEnd">
            </div>


            <div class="form-group">
                <label for="MaintenancePeriodMonths">
                    Maintenance Period (months)
                </label>
                <input
                    type="number"
                    id="MaintenancePeriodMonths"
                    name="MaintenancePeriodMonths"
                    min="1"
                    placeholder="Example: 6"
                >
            </div>

            <div class="form-group">
                <label for="LastMaintenanceDate">
                   Last Maintenance Date
                </label>
                <input
                    type="date"
                    id="LastMaintenanceDate"
                    name="LastMaintenanceDate"
                >
            </div>


<div class="form-group">
    <label for="InvoiceFile">Invoice</label>
    <input
        type="file"
        id="InvoiceFile"
        name="InvoiceFile"
        accept=".pdf,.jpg,.jpeg,.png"
    >
</div>

<div class="form-group">
    <label for="WarrantyFile">Warranty Document</label>
    <input
        type="file"
        id="WarrantyFile"
        name="WarrantyFile"
        accept=".pdf,.jpg,.jpeg,.png"
    >
</div>

            <div class="form-group">
                <label for="Status">Status</label>
                <select id="Status" name="Status" required>
                    <option value="IN STOCK">IN STOCK</option>
                    <option value="ASSIGNED">ASSIGNED</option>
                    <option value="FAULTY">FAULTY</option>
                    <option value="IN MAINTENANCE">IN MAINTENANCE</option>
                    <option value="SCRAPPED">SCRAPPED</option>
                </select>
            </div>

            <div class="form-group">
                <label for="Notes">Notes</label>
                <textarea id="Notes" name="Notes"></textarea>
            </div>

            <div class="form-actions">
                <button type="submit">
                    Add Asset
                </button>

                <a href="{{ url_for('assets') }}" class="btn btn-secondary">
                    Cancel
                </a>
            </div>

        </form>

    </div>

</div>

</body>
</html>
