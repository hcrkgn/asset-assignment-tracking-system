services:
  app:
    build: .
    container_name: aats_app
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    environment:
      MYSQL_HOST: db
      MYSQL_DATABASE: ${MYSQL_DATABASE:-aats_db}
      MYSQL_USER: ${MYSQL_USER:-aats_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-aats_dev_password}
      SECRET_KEY: ${SECRET_KEY:-aats_development_only_secret_key}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: aats_db
    restart: always
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-aats_root_dev_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-aats_db}
      MYSQL_USER: ${MYSQL_USER:-aats_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-aats_dev_password}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./app/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./app/database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
